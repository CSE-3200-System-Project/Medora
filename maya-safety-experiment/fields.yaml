field_categories:
  - category: "Identity and provenance"
    fields:
      - name: "name"
        description: "Exact object name and its role in the research."
        detail_level: "brief"
      - name: "exact_id_and_revision"
        description: "Repository, model or dataset identifier and an immutable revision, commit, or version."
        detail_level: "detailed"
      - name: "owner_and_authoritative_sources"
        description: "Owner, authors, release date, paper, model or dataset card, and primary documentation."
        detail_level: "detailed"
      - name: "base_model_and_derivative_chain"
        description: "Upstream base, adapters, merges, architecture, tokenizer, and derivative provenance."
        detail_level: "detailed"
  - category: "Legal ethics and privacy"
    fields:
      - name: "licence_and_terms"
        description: "Declared licence, inherited terms, use restrictions, redistribution conditions, and conflicts among sources."
        detail_level: "detailed"
      - name: "consent_privacy_and_deidentification"
        description: "Collection consent, PHI/PII status, deidentification evidence, external processing, retention, and data residency."
        detail_level: "detailed"
      - name: "deployment_eligibility"
        description: "Whether use is allowed for research, adapter publication, commercial deployment, or only a quarantined analysis."
        detail_level: "moderate"
  - category: "Clinical and language fit"
    fields:
      - name: "construct_and_claim_boundary"
        description: "What this object can evaluate or support and what it cannot establish."
        detail_level: "detailed"
      - name: "bengali_banglish_coverage"
        description: "Evidence for Bangla script, Banglish, English/code-mix, numeral variants, dialects, and noisy spelling."
        detail_level: "detailed"
      - name: "clinical_navigation_fit"
        description: "Fit for emergency escalation, benign control, uncertainty, self-harm agency, and non-diagnostic navigation."
        detail_level: "detailed"
      - name: "clinical_authority_and_human_review"
        description: "Generator, grader, policy, or human role; final authority; reviewer qualifications; blinding; and adjudication."
        detail_level: "detailed"
  - category: "Technical feasibility"
    fields:
      - name: "hardware_and_memory"
        description: "Parameter count, quantization, expected GPU VRAM and system RAM, and PC versus Colab feasibility."
        detail_level: "detailed"
      - name: "runtime_and_training_stack"
        description: "Supported inference, QLoRA/LoRA, framework versions, chat template, reasoning mode, and tool requirements."
        detail_level: "detailed"
      - name: "cost_latency_and_runtime_limits"
        description: "Expected compute, storage, API cost, runtime, interruption, and throughput constraints."
        detail_level: "moderate"
  - category: "Experimental validity"
    fields:
      - name: "experimental_role"
        description: "Incumbent, untuned control, tuned arm, reference, training-only corpus, frozen gate, supporting benchmark, or exclusion."
        detail_level: "brief"
      - name: "dataset_independence_and_contamination"
        description: "Separation of training, tuning, prompt development, checkpoint selection, frozen gate, and external tests, including overlap checks."
        detail_level: "detailed"
      - name: "statistical_design"
        description: "Paired unit, endpoints, margins, confidence intervals, sample-size limits, seed aggregation, multiplicity, and missing-output policy."
        detail_level: "detailed"
      - name: "behavior_configuration"
        description: "Pinned prompts, tokenizer/chat template, temperature, top-p/top-k, seed, stops, output limit, retries, tools, and locale."
        detail_level: "detailed"
      - name: "failure_modes_and_operational_tests"
        description: "Unsafe content, false escalation, timeout, refusal, malformed/empty output, wrong language, invented contact, outage, and fallback behavior."
        detail_level: "detailed"
  - category: "Reproducibility governance and decision"
    fields:
      - name: "execution_manifest_and_artifacts"
        description: "OS, Python, CUDA, GPU, dependency locks, model and adapter hashes, prompt/data/response hashes, logs, and restricted storage."
        detail_level: "detailed"
      - name: "change_control_and_rerun_triggers"
        description: "Changes to model, provider, prompt, dependency, quantization, policy, or referral data that invalidate evidence."
        detail_level: "detailed"
      - name: "adverse_output_protocol"
        description: "Secure handling, clinical escalation, severity, remediation, disclosure boundaries, and rollback."
        detail_level: "detailed"
      - name: "recommendation_and_signoff"
        description: "Adopt, optional comparator, defer, quarantine, or reject; rationale; unresolved risks; reviewer signoff; and conditions."
        detail_level: "detailed"
      - name: "evidence_quality_and_uncertainties"
        description: "Strength of primary evidence, inconsistencies, missing facts, and explicit inferences."
        detail_level: "detailed"
  - category: "Reserved"
    fields:
      - name: "uncertain"
        description: "Names of fields whose values remain uncertain."
        detail_level: "brief"
