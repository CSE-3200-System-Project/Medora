metadata_version: 1
name: Medora SoftwareX revision reproducibility
research_field: Computer Science
description: >-
  Reproduces Medora's focused SoftwareX revision checks using deterministic synthetic
  fixtures, fresh isolated PostgreSQL booking trials, and selected S4/S5 medicine
  reconstruction. It also regenerates historical tables from frozen reports and can
  check approved detector artifacts. The capsule does not run hosted providers,
  rescore development data as held-out evidence, claim equivalence between Linux and
  original host timings, or establish clinical validity. No patient credentials are required.
